name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: make install/dev

      - name: Run checks
        run: make check

      - name: Run unit tests
        run: make test/unit

  model-tables-on-engine-main:
    # The check job installs the engine uv.lock pins, so it can't see an engine change before
    # it's released. This runs the model-table tests against engine main to flag a retired
    # model early. Non-blocking: engine main also carries unrelated changes.
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      UV_PROJECT_ENVIRONMENT: .venv-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies with engine main
        run: |
          make install/dev
          uv pip install --python .venv-dev "griptape-nodes-engine @ git+https://github.com/griptape-ai/griptape-nodes-engine@main"

      - name: Run the model-table tests
        run: uv run --no-sync pytest tests/unit/test_legacy_model_value_migration.py tests/unit/test_model_catalog_consistency.py
