[project]
name = "griptape-nodes-library-standard"
version = "0.86.0"
description = "Default nodes for Griptape Nodes"
authors = [{ name = "Griptape, Inc" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  # Artifacts and loaders only. LLM work goes through pydantic-ai.
  "griptape[loaders-image,loaders-pdf]>=1.11.0",
  "pydantic-ai-slim[anthropic,bedrock,cohere,mcp,openai]>=2.29.0",
  "ddgs>=9.0.0",
  "exa-py>=2.0.0",
  "trafilatura>=2.0",
  "dateparser>=1.2.0",
  "json-repair>=0.46.1",
  "static-ffmpeg>=2.8",
  "jmespath>=1.0.1",
  "numpy>=1.26.0",
  "scikit-learn>=1.3.0",
  "threadpoolctl>=3.0.0",
  "pillow>=11.2.1",
  "asteval>=1.0.8",
  "color-matcher",
  "zstandard>=0.22.0",
    "tokenizers>=0.22.0,<0.23",
  "lxml>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["griptape_nodes_library"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Workflows saved by the engine on main; kept byte-for-byte.
extend-exclude = ["tests/unit/compat/fixtures"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
  "griptape-nodes-engine>=0.103.2",
  "pyright>=1.1.396",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.8.0",
  "pytest",
  "lxml-stubs>=0.5.1",
  "pytest-xdist>=3.8.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [
  "**/templates/*",
  "tests/unit/compat/fixtures",
  "tests/integration/*",
  ".venv",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]
pythonVersion = "3.12"
reportIncompatibleMethodOverride = false
