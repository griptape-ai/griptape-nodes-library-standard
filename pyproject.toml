[project]
name = "griptape-nodes-library-standard"
version = "0.86.0"
description = "Default nodes for Griptape Nodes"
authors = [{ name = "Griptape, Inc" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "griptape[drivers-prompt-amazon-bedrock,drivers-prompt-anthropic,drivers-prompt-cohere,drivers-prompt-ollama,drivers-web-scraper-trafilatura,drivers-web-search-duckduckgo,drivers-web-search-exa,loaders-image,loaders-pdf]>=1.9.4",
  "json-repair>=0.46.1",
  "static-ffmpeg>=2.8",
  "jmespath>=1.0.1",
  "json-schema-to-pydantic>=0.4.6",
  "numpy>=1.26.0",
  "scikit-learn>=1.3.0",
  "threadpoolctl>=3.0.0",
  "pillow>=11.2.1",
  "asteval>=1.0.8",
  "color-matcher",
  "zstandard>=0.22.0",
    "tokenizers>=0.22.0,<0.23",
  "lxml>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["griptape_nodes_library"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
  # What this actually needs is `retained_mode.events.budget_events`, which
  # utils/attribution.py imports at module scope -- so an engine without it is an ImportError
  # that takes 33 library modules down with it, not a degraded build. No released engine has
  # it yet: the module arrived in the BudgetManager PR and the newest release is 0.100.2.
  #
  # 0.101.0 is a floor by necessity and not a precise one. The engine's own main branch is
  # already versioned 0.101.0 with that PR unmerged, so a 0.101.0 cut from before the merge
  # would satisfy this line while still lacking the module. Re-pin to the release that
  # actually contains it, confirmed by looking rather than by version arithmetic -- and pin
  # `engine_version` in griptape_nodes_library.json to the same release, which is the copy
  # users are gated on (this one is dev-group, so it binds local runs and CI only).
  "griptape-nodes-engine>=0.101.0",
  "pyright>=1.1.396",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.8.0",
  "pytest",
  "lxml-stubs>=0.5.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [
  "**/templates/*",
  "tests/integration/*",
  ".venv",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]
pythonVersion = "3.12"
reportIncompatibleMethodOverride = false
